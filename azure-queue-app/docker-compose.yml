x-storage-env: &storage-env
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000", "10001:10001", "10002:10002"]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10001,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment: *storage-env
    ports: ["8000:8000"]
    depends_on:
      azurite:
        condition: service_healthy
    restart: on-failure

  worker:
    build: .
    command: python -m app.worker
    environment: *storage-env
    depends_on:
      azurite:
        condition: service_healthy
    restart: on-failure
    deploy:
      replicas: 2
