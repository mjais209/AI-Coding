x-queue-env: &queue-env
  Queue__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;}

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-queue --queueHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10001:10001"]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10001,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  producer:
    build:
      context: .
      args: { APP: Producer }
    environment:
      <<: *queue-env
      Producer__Count: ${PRODUCER_COUNT:-20}
      Producer__IntervalMilliseconds: ${PRODUCER_INTERVAL_MS:-250}
    depends_on:
      azurite:
        condition: service_healthy

  consumer:
    build:
      context: .
      args: { APP: Consumer }
    environment: *queue-env
    depends_on:
      azurite:
        condition: service_healthy
    restart: on-failure
    deploy:
      replicas: 2
